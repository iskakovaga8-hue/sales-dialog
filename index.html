<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диалог, который приводит к оплате</title>
  <meta name="description" content="Пошаговый план продаж в переписке — документ для Школы экспертов">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); padding: 60px 48px; max-width: 560px; width: 90%; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
    .subtitle { color: #666; font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; background: #5884f5; color: white; text-decoration: none; padding: 16px 36px; border-radius: 50px; font-weight: 600; font-size: 16px; transition: all 0.2s; }
    .btn:hover { background: #3a6bd4; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(88,132,245,0.3); }
    .note { margin-top: 20px; font-size: 13px; color: #999; }
    .btn-download { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; color: #5884f5; text-decoration: none; font-size: 14px; font-weight: 500; }
    .btn-download:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128172;</div>
    <h1>Диалог, который приводит к оплате</h1>
    <p class="subtitle">Пошаговый план продаж в переписке &mdash; от первого сообщения до успешной сделки</p>
    <a href="https://wfm-diagnostic-demo.vercel.app/sales-dialog.mhtml" class="btn" target="_blank">
      Открыть документ &#8599;
    </a>
    <div class="note">Документ откроется в новой вкладке</div>
  </div>
</body>
</html>
